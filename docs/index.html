<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crease · Live Cricket Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ground: #f4f6f7;
      --surface: #ffffff;
      --surface-key: #f6f8f9;
      --ink: #101315;
      --ink-muted: #5d666e;
      --hairline: #e2e6e9;
      --hairline-subtle: #eceff2;
      --pill-muted: #ebeef0;
      --green: #0b7a4b;
      --green-soft: #e6f4ed;
      --red: #d63949;
      --shadow: 0 2px 10px -2px rgba(16, 19, 21, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #0d0f11;
        --surface: #15191c;
        --surface-key: #1e2327;
        --ink: #f4f6f8;
        --ink-muted: #8e98a1;
        --hairline: #262c31;
        --hairline-subtle: #1e2328;
        --pill-muted: #20252a;
        --green: #19a96b;
        --green-soft: #132d22;
        --red: #ec5463;
        --shadow: 0 2px 12px -2px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--ground);
      color: var(--ink);
      min-height: 100dvh;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 16px 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.4px;
      text-decoration: none;
      color: var(--ink);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
      background: var(--green-soft);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .glass {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }

    .hero-score {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0 6px;
    }

    .score-num {
      font-family: 'Barlow', sans-serif;
      font-size: 58px;
      line-height: 0.98;
      letter-spacing: -1.6px;
      font-weight: 700;
    }

    .score-num .wkts {
      font-weight: 500;
      font-size: 44px;
      color: var(--ink-muted);
    }

    .muted { color: var(--ink-muted); font-size: 13.5px; }
    .green { color: var(--green); font-weight: 600; }

    .format-pill {
      display: inline-block;
      background: var(--pill-muted);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 6px;
    }

    .batters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }

    .batter-pill {
      background: var(--surface-key);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .batter-pill.striker { border-color: var(--green); border-width: 1.5px; }

    .over-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .ball-dot {
      font-family: 'Barlow', sans-serif;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13.5px;
      font-weight: 700;
      border: 1px solid var(--hairline);
      background: var(--surface-key);
    }

    .ball-dot.boundary {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
    }

    .ball-dot.wicket {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      margin: 18px 4px 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      padding: 6px 4px 10px;
      border-bottom: 1px solid var(--hairline-subtle);
    }

    th:first-child, td:first-child { text-align: left; }

    td {
      text-align: right;
      padding: 10px 4px;
      border-bottom: 1px solid var(--hairline-subtle);
    }

    tr:last-child td { border-bottom: none; }

    .dismissal {
      display: block;
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .innings-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .inn-btn {
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .inn-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      font-weight: 600;
    }

    .match-card {
      display: block;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease;
    }

    .match-card:hover { border-color: var(--green); }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .open-app-btn {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: var(--green);
      padding: 6px 12px;
      border-radius: 999px;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      color: var(--ink-muted);
      font-size: 12px;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="./">Crease</a>
      <div class="topbar-actions">
        <a id="open-app-btn" class="open-app-btn" href="#">Open in App</a>
        <span id="status-badge" class="live-badge" style="display:none;">
          <span class="live-dot"></span>
          <span id="status-text">LIVE</span>
        </span>
      </div>
    </header>

    <main id="app">
      <div class="glass muted">Loading live scorecard…</div>
    </main>

    <footer class="footer">Live ball-by-ball · Scored with Crease</footer>
  </div>

  <script>
    const SUPABASE_URL = 'https://ajwqkcblakfojsbyqjqt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6MtwRj2UjMJJSeRWqDDnOw_oUW_NR0z';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const matchId = params.get('match');
    const tournamentId = params.get('tournament');
    const authCode = params.get('code');
    const teamCode = params.get('team-code');
    let selectedInnings = null;
    let currentMatch = null;
    let currentEvents = [];
    let currentPlayersById = {};
    let currentTeamsById = {};

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function resolvePlayerName(match, id) {
      if (!id) return '';
      return currentPlayersById[id] || (match && match.ad_hoc_players && match.ad_hoc_players[id]) || 'Player';
    }

    function resolveTeamName(match, side) {
      const tid = side === 'a' ? match.team_a_id : match.team_b_id;
      const fallback = side === 'a' ? match.team_a : match.team_b;
      return (tid && currentTeamsById[tid]) || fallback || 'Team';
    }

    function deriveInnings(match, events, innNum) {
      const balls = events
        .filter(e => !e.voided && e.innings_number === innNum)
        .sort((a, b) => a.sequence_number - b.sequence_number);

      const firstSide = match.batting_first_side === 'b' ? 'b' : 'a';
      const secondSide = firstSide === 'a' ? 'b' : 'a';
      const followOn = !!match.follow_on_enforced;
      const battingSide = innNum === 1 ? firstSide
        : innNum === 2 ? secondSide
        : innNum === 3 ? (followOn ? secondSide : firstSide)
        : (followOn ? firstSide : secondSide);
      const bowlingSide = battingSide === 'a' ? 'b' : 'a';
      const battingTeam = resolveTeamName(match, battingSide);
      const bowlingTeam = resolveTeamName(match, bowlingSide);

      let runs = 0, wickets = 0, legalBalls = 0;
      let wides = 0, noBalls = 0, byes = 0, legByes = 0;
      const batters = new Map();
      const bowlers = new Map();
      const overs = [];
      let curOver = [];
      let curLegal = 0;
      let strikerId = innNum === 1 ? (match.opening_striker_1_id || '') : (match.opening_striker_2_id || '');
      let nonStrikerId = innNum === 1 ? (match.opening_non_striker_1_id || '') : (match.opening_non_striker_2_id || '');
      let bowlerId = innNum === 1 ? (match.opening_bowler_1_id || '') : (match.opening_bowler_2_id || '');

      const nameOf = (id) => resolvePlayerName(match, id);
      const ensureBat = (id) => {
        if (!id) return null;
        if (!batters.has(id)) batters.set(id, { id, name: nameOf(id), runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, dismissal: '' });
        return batters.get(id);
      };
      const ensureBowl = (id) => {
        if (!id) return null;
        if (!bowlers.has(id)) bowlers.set(id, { id, name: nameOf(id), legal: 0, runs: 0, wickets: 0 });
        return bowlers.get(id);
      };

      for (const b of balls) {
        const bt = ensureBat(b.striker_id);
        ensureBat(b.non_striker_id);
        const bw = ensureBowl(b.bowler_id);
        strikerId = b.striker_id;
        nonStrikerId = b.non_striker_id;
        bowlerId = b.bowler_id;

        const rBat = b.runs_off_bat || 0;
        const rExt = b.extra_runs || 0;
        const ext = b.extra_type || 'none';
        const isLegal = ext !== 'wide' && ext !== 'noBall' && ext !== 'penalty' && b.wicket_type !== 'retiredHurt';

        runs += rBat + rExt;
        if (bt) {
          bt.runs += rBat;
          if (ext !== 'wide' && ext !== 'penalty' && b.wicket_type !== 'retiredHurt') bt.balls += 1;
          if (rBat === 4) bt.fours += 1;
          if (rBat === 6) bt.sixes += 1;
        }

        if (ext === 'wide') wides += rExt;
        else if (ext === 'noBall') noBalls += rExt;
        else if (ext === 'bye' || ext === 'penalty') byes += rExt;
        else if (ext === 'legBye') legByes += rExt;

        if (bw) {
          if (ext !== 'penalty') {
            bw.runs += (ext === 'bye' || ext === 'legBye') ? rBat : (rBat + rExt);
          }
          if (isLegal) bw.legal += 1;
        }
        if (isLegal) {
          legalBalls += 1;
          curLegal += 1;
        }

        if (b.is_wicket) {
          const countsWicket = b.wicket_type !== 'retiredHurt';
          const outId = b.dismissed_batter_id || b.striker_id;
          const outBt = ensureBat(outId);
          const bwName = nameOf(b.bowler_id);
          const fName = b.fielder_id ? nameOf(b.fielder_id) : '';
          if (countsWicket) {
            wickets += 1;
            if (outBt) {
              outBt.isOut = true;
              outBt.dismissal = b.wicket_type === 'caught'
                ? (fName ? `c ${fName} b ${bwName}` : `c & b ${bwName}`)
                : b.wicket_type === 'bowled' ? `b ${bwName}`
                : b.wicket_type === 'lbw' ? `lbw b ${bwName}`
                : b.wicket_type === 'stumped' ? (fName ? `st ${fName} b ${bwName}` : `stumped b ${bwName}`)
                : b.wicket_type === 'runOut' ? (fName ? `run out (${fName})` : 'run out')
                : (b.wicket_type || 'out');
            }
            if (bw && b.wicket_type !== 'runOut' && b.wicket_type !== 'retired') bw.wickets += 1;
          } else if (outBt) {
            outBt.dismissal = 'retired hurt';
          }
          if (b.next_batter_id) {
            ensureBat(b.next_batter_id);
            if (outId === nonStrikerId) nonStrikerId = b.next_batter_id;
            else strikerId = b.next_batter_id;
          }
        }

        const running = ext === 'penalty' ? 0
          : ext === 'wide' ? Math.max(0, rExt - 1)
          : ext === 'noBall' ? rBat + Math.max(0, rExt - 1)
          : rBat + rExt;
        if (running % 2 === 1) [strikerId, nonStrikerId] = [nonStrikerId, strikerId];

        curOver.push(b);
        if (curLegal === 6) {
          overs.push(curOver);
          curOver = [];
          curLegal = 0;
          [strikerId, nonStrikerId] = [nonStrikerId, strikerId];
        }
      }
      if (curOver.length > 0) overs.push(curOver);

      const declared = Array.isArray(match.declared_innings) && match.declared_innings.includes(innNum);
      return {
        innNum, battingTeam, bowlingTeam, runs, wickets, legalBalls,
        oversText: `${Math.floor(legalBalls / 6)}.${legalBalls % 6}`,
        scoreText: `${runs}/${wickets}${declared ? 'd' : ''}`,
        crr: legalBalls > 0 ? (runs / (legalBalls / 6)).toFixed(2) : '0.00',
        striker: nameOf(strikerId), nonStriker: nameOf(nonStrikerId), bowler: nameOf(bowlerId),
        batters: Array.from(batters.values()),
        bowlers: Array.from(bowlers.values()),
        currentOver: overs.length ? overs[overs.length - 1] : [],
        extras: { total: wides + noBalls + byes + legByes, wides, noBalls, byes, legByes },
        hasData: balls.length > 0 || declared,
      };
    }

    function shortMark(b) {
      if (b.is_wicket) return 'W';
      if (b.extra_type === 'wide') return b.extra_runs > 1 ? `${b.extra_runs}wd` : 'wd';
      if (b.extra_type === 'noBall') {
        const t = (b.runs_off_bat || 0) + (b.extra_runs || 0);
        return t > 1 ? `${t}nb` : 'nb';
      }
      if (b.extra_type === 'bye') return `${b.extra_runs}b`;
      if (b.extra_type === 'legBye') return `${b.extra_runs}lb`;
      return b.runs_off_bat === 0 ? '•' : String(b.runs_off_bat);
    }

    function renderMatch() {
      const m = currentMatch;
      if (!m) return;
      document.title = `${m.team_a} v ${m.team_b} · Crease Live`;
      document.getElementById('status-badge').style.display = 'inline-flex';

      const maxInn = m.is_test_match ? 4 : 2;
      const inningsList = [];
      for (let i = 1; i <= maxInn; i++) {
        const d = deriveInnings(m, currentEvents, i);
        if (d.hasData || i === 1) inningsList.push(d);
      }
      if (selectedInnings == null) {
        selectedInnings = inningsList[inningsList.length - 1].innNum;
      }
      const inn = inningsList.find(x => x.innNum === selectedInnings) || inningsList[0];

      const strikerObj = inn.batters.find(b => b.name === inn.striker) || { name: inn.striker, runs: 0, balls: 0 };
      const nonStrikerObj = inn.batters.find(b => b.name === inn.nonStriker) || { name: inn.nonStriker, runs: 0, balls: 0 };
      const bowlerObj = inn.bowlers.find(b => b.name === inn.bowler);

      const tabsHtml = inningsList.length > 1 ? `
        <div class="innings-tabs">
          ${inningsList.map(x => `
            <button class="inn-btn ${x.innNum === inn.innNum ? 'active' : ''}" onclick="selectInnings(${x.innNum})">
              ${esc(x.battingTeam)} ${m.is_test_match ? `#${x.innNum}` : ''} (${esc(x.scoreText)})
            </button>
          `).join('')}
        </div>
      ` : '';

      const overHtml = inn.currentOver.map(b => {
        const cls = b.is_wicket ? 'wicket' : (b.runs_off_bat === 4 || b.runs_off_bat === 6 ? 'boundary' : '');
        return `<span class="ball-dot ${cls}">${esc(shortMark(b))}</span>`;
      }).join('');

      document.getElementById('app').innerHTML = `
        <section class="glass">
          <div class="muted">${esc(m.team_a)} v ${esc(m.team_b)} <span class="format-pill">${esc(m.format_label)}</span></div>
          <div class="hero-score">
            <div>
              <div class="score-num">${inn.runs}<span class="wkts">/${inn.wickets}</span></div>
              <div class="muted" style="margin-top:4px;">${esc(inn.battingTeam)} · ${inn.oversText} overs</div>
            </div>
            <div style="text-align:right;">
              <div class="muted">CRR</div>
              <div style="font-size:18px;font-weight:600;">${inn.crr}</div>
            </div>
          </div>

          <div class="batters-grid">
            <div class="batter-pill striker">
              <span>${esc(strikerObj.name)} <strong class="green">*</strong></span>
              <span><strong>${strikerObj.runs}</strong> <span class="muted">(${strikerObj.balls})</span></span>
            </div>
            <div class="batter-pill">
              <span>${esc(nonStrikerObj.name)}</span>
              <span><strong>${nonStrikerObj.runs}</strong> <span class="muted">(${nonStrikerObj.balls})</span></span>
            </div>
          </div>

          ${bowlerObj ? `<div class="muted" style="text-align:center;">${esc(bowlerObj.name)} &nbsp; ${Math.floor(bowlerObj.legal / 6)}.${bowlerObj.legal % 6}-${bowlerObj.runs}-${bowlerObj.wickets}</div>` : ''}

          ${overHtml ? `<div class="over-strip"><span class="muted" style="font-size:12px;">This over</span>${overHtml}</div>` : ''}
        </section>

        ${tabsHtml}

        <div class="section-title">Batting · ${esc(inn.battingTeam)}</div>
        <section class="glass" style="padding:12px 16px;">
          <table>
            <thead>
              <tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
            </thead>
            <tbody>
              ${inn.batters.map(b => `
                <tr>
                  <td>
                    <span class="${!b.isOut ? 'green' : ''}">${esc(b.name)}${!b.isOut ? ' *' : ''}</span>
                    ${b.dismissal ? `<span class="dismissal">${esc(b.dismissal)}</span>` : ''}
                  </td>
                  <td><strong>${b.runs}</strong></td>
                  <td>${b.balls}</td>
                  <td>${b.fours}</td>
                  <td>${b.sixes}</td>
                  <td>${b.balls ? Math.round((b.runs / b.balls) * 100) : 0}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div class="muted" style="margin-top:10px;font-size:12px;">
            Extras ${inn.extras.total} (wd ${inn.extras.wides}, nb ${inn.extras.noBalls}, b ${inn.extras.byes}, lb ${inn.extras.legByes})
          </div>
        </section>

        <div class="section-title">Bowling · ${esc(inn.bowlingTeam)}</div>
        <section class="glass" style="padding:12px 16px;">
          <table>
            <thead>
              <tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>
            </thead>
            <tbody>
              ${inn.bowlers.map(bw => `
                <tr>
                  <td>${esc(bw.name)}</td>
                  <td>${Math.floor(bw.legal / 6)}.${bw.legal % 6}</td>
                  <td>${bw.runs}</td>
                  <td><strong>${bw.wickets}</strong></td>
                  <td>${bw.legal ? (bw.runs / (bw.legal / 6)).toFixed(1) : '0.0'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </section>
      `;
    }

    window.selectInnings = (n) => {
      selectedInnings = n;
      renderMatch();
    };

    const MATCH_COLS = 'id,team_a_id,team_b_id,team_a,team_b,batting_first_side,overs_limit,players_per_side,format_label,opening_striker_1_id,opening_non_striker_1_id,opening_bowler_1_id,opening_striker_2_id,opening_non_striker_2_id,opening_bowler_2_id,ad_hoc_players,tournament_stage,is_test_match,declared_innings,follow_on_enforced,first_innings_target_override';
    const BALL_COLS = 'id,match_id,innings_number,sequence_number,striker_id,non_striker_id,bowler_id,runs_off_bat,extra_type,extra_runs,is_wicket,wicket_type,dismissed_batter_id,fielder_id,next_batter_id,voided';
    const RECENT_MATCH_COLS = 'id,team_a,team_b,format_label,created_at';
    let pollTimer = null;

    function applyBundle(bundle) {
      if (!bundle || !bundle.match) return;
      currentMatch = bundle.match;
      currentEvents = Array.isArray(bundle.events) ? bundle.events : [];
      currentPlayersById = {};
      for (const p of (bundle.players || [])) {
        if (p && p.id && p.display_name) currentPlayersById[p.id] = p.display_name;
      }
      currentTeamsById = {};
      for (const t of (bundle.teams || [])) {
        if (t && t.id && t.name) currentTeamsById[t.id] = t.name;
      }
    }

    function upsertLocalEvent(ev) {
      if (!ev || !ev.id) return;
      const idx = currentEvents.findIndex(e => e.id === ev.id);
      if (idx >= 0) currentEvents[idx] = ev;
      else currentEvents.push(ev);
      currentEvents.sort((a, b) => (a.innings_number - b.innings_number) || (a.sequence_number - b.sequence_number));
    }

    function stopPollingFallback() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function startPollingFallback(id) {
      if (pollTimer) return;
      pollTimer = setInterval(async () => {
        if (document.hidden) return;
        const { data: bundle } = await sb.rpc('get_live_match_bundle', { p_match_id: id });
        if (bundle && bundle.match) {
          applyBundle(bundle);
          renderMatch();
        }
      }, 12000);
    }

    async function loadSingleMatch(id) {
      const { data: bundle } = await sb.rpc('get_live_match_bundle', { p_match_id: id });
      if (!bundle || !bundle.match) {
        document.getElementById('app').innerHTML = `<div class="glass">Match not found yet. Ask the scorer to sync online.</div>`;
        return;
      }
      applyBundle(bundle);
      renderMatch();

      // Subscribe to live Realtime ball & player updates incrementally
      sb.channel(`match-${id}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ball_events', filter: `match_id=eq.${id}` }, (payload) => {
          if (payload.eventType === 'DELETE' && payload.old?.id) {
            currentEvents = currentEvents.filter(e => e.id !== payload.old.id);
          } else if (payload.new) {
            upsertLocalEvent(payload.new);
          }
          renderMatch();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'matches', filter: `id=eq.${id}` }, (payload) => {
          if (payload.new) {
            currentMatch = { ...currentMatch, ...payload.new };
            renderMatch();
          }
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'players' }, (payload) => {
          if (payload.new && payload.new.id && currentPlayersById[payload.new.id]) {
            currentPlayersById[payload.new.id] = payload.new.display_name;
            renderMatch();
          }
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            stopPollingFallback();
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
            startPollingFallback(id);
          }
        });
    }

    async function loadRecentMatches() {
      const { data: matches } = await sb.from('matches').select(RECENT_MATCH_COLS).eq('is_demo', false).order('created_at', { ascending: false }).limit(20);
      if (!matches || matches.length === 0) {
        document.getElementById('app').innerHTML = `<div class="glass muted">No synced matches yet. Score a match in the Crease Android app to see it live here.</div>`;
        return;
      }
      document.getElementById('app').innerHTML = `
        <div class="section-title">Recent Live Matches</div>
        ${matches.map(m => `
          <a class="glass match-card" href="?match=${encodeURIComponent(m.id)}">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <strong>${esc(m.team_a)} v ${esc(m.team_b)}</strong>
              <span class="format-pill">${esc(m.format_label)}</span>
            </div>
            <div class="muted" style="margin-top:6px;">Tap to watch live scorecard →</div>
          </a>
        `).join('')}
      `;
    }

    async function loadTeamInvite(code) {
      const clean = String(code || '').replace(/[^0-9]/g, '');
      const formatted = clean.length === 6 ? `${clean.slice(0, 3)} ${clean.slice(3)}` : clean;
      const fallback = encodeURIComponent(window.location.href);
      const intentUrl = `intent://join-team/${encodeURIComponent(clean)}#Intent;scheme=crease;package=app.awventures.crease;S.browser_fallback_url=${fallback};end`;
      try {
        const { data, error } = await sb.rpc('preview_team_by_code', { p_join_code: clean });
        if (error || !data) throw error || new Error('Not found');
        const players = Array.isArray(data.players) ? data.players : [];
        document.getElementById('app').innerHTML = `
          <div class="glass">
            <div class="muted" style="font-size:12px;font-weight:600;letter-spacing:0.8px;color:var(--green);">TEAM INVITATION</div>
            <h1 style="font-size:24px;font-weight:700;margin:6px 0 4px;">Join ${esc(data.team_name)}</h1>
            <p class="muted">${players.length} squad players · Claim your name in Crease to unlock your career stats.</p>
            <div style="margin:18px 0;padding:16px;border-radius:16px;background:var(--green-soft);text-align:center;">
              <div style="font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--green);">TEAM CODE</div>
              <div style="font-size:34px;font-weight:700;letter-spacing:6px;color:var(--green);margin-top:4px;">${esc(formatted)}</div>
            </div>
            ${/Android/i.test(navigator.userAgent)
              ? `<a href="${intentUrl}" style="display:block;text-align:center;background:var(--green);color:#fff;padding:13px 16px;border-radius:999px;font-weight:600;text-decoration:none;">Open in Crease App</a>`
              : `<p class="muted" style="text-align:center;">Open Crease on Android → Teams → Join and enter <strong>${esc(formatted)}</strong>.</p>`
            }
          </div>
        `;
      } catch (_) {
        document.getElementById('app').innerHTML = `
          <div class="glass">
            <div class="section-title">Invalid or expired team code</div>
            <p class="muted" style="margin-top:8px;">Ask your team captain for the latest 6-digit Crease team code.</p>
          </div>
        `;
      }
    }

    function formatShortDateMs(ms) {
      if (!ms) return null;
      const d = new Date(Number(ms));
      if (isNaN(d.getTime())) return null;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[d.getMonth()]} ${d.getDate()}`;
    }

    async function loadTournament(id) {
      const TOURN_COLS = 'id, name, location, start_date, end_date, overs_limit, format_label, points_for_win, points_for_tie, structure';
      const [{ data: t }, { data: ttRows }, { data: matches }] = await Promise.all([
        sb.from('tournaments').select(TOURN_COLS).eq('id', id).maybeSingle(),
        sb.from('tournament_teams').select('team_id, ad_hoc_name, seed_order, teams(name)').eq('tournament_id', id).order('seed_order', { ascending: true }),
        sb.from('matches').select(MATCH_COLS).eq('tournament_id', id).order('created_at', { ascending: false }),
      ]);
      if (!t) {
        document.getElementById('app').innerHTML = `<div class="glass">Tournament not found yet. Ask the organizer to sync online.</div>`;
        return;
      }
      document.title = `${t.name} · Crease Tournament`;
      const matchList = matches || [];
      const matchIds = matchList.map(m => m.id);
      let allEvents = [];
      if (matchIds.length > 0) {
        const { data: ev } = await sb.from('ball_events').select(BALL_COLS).in('match_id', matchIds).order('sequence_number', { ascending: true });
        allEvents = ev || [];
      }
      const eventsByMatch = {};
      for (const e of allEvents) {
        (eventsByMatch[e.match_id] ||= []).push(e);
      }

      const teamNames = (ttRows || []).map(r => (r.teams && r.teams.name) || r.ad_hoc_name).filter(Boolean);
      const stats = {};
      const ensure = (name) => {
        const k = name.toLowerCase();
        if (!stats[k]) stats[k] = { name, p: 0, w: 0, l: 0, pts: 0, rf: 0, bf: 0, ra: 0, ba: 0 };
        return stats[k];
      };
      for (const name of teamNames) ensure(name);

      const matchCardsHtml = matchList.map(m => {
        const evs = eventsByMatch[m.id] || [];
        const i1 = deriveInnings(m, evs, 1);
        const i2 = deriveInnings(m, evs, 2);
        const maxBalls = m.overs_limit > 0 ? m.overs_limit * 6 : 0;
        const maxWkts = Math.max(1, (m.players_per_side || 11) - 1);
        const abandoned = Array.isArray(m.declared_innings) && m.declared_innings.includes(-1);
        const i1Done = maxBalls > 0 && (i1.legalBalls >= maxBalls || i1.wickets >= maxWkts);
        const i2Started = i2.legalBalls > 0 || i2.runs > 0 || i2.wickets > 0;
        const chased = i1Done && i2.runs > i1.runs;
        const i2Done = i1Done && (chased || (maxBalls > 0 && i2.legalBalls >= maxBalls) || i2.wickets >= maxWkts);
        const completed = abandoned || i2Done;
        const isLeague = !m.tournament_stage || m.tournament_stage === 'league';

        let resultText = 'Live';
        if (abandoned) {
          resultText = 'No result';
          if (isLeague) {
            const sa = ensure(m.team_a), sbTeam = ensure(m.team_b);
            sa.p++; sbTeam.p++; sa.pts += (t.points_for_tie ?? 1); sbTeam.pts += (t.points_for_tie ?? 1);
          }
        } else if (i2Done) {
          if (i2.runs > i1.runs) resultText = `${i2.battingTeam} won by ${maxWkts - i2.wickets} wkts`;
          else if (i1.runs > i2.runs) resultText = `${i1.battingTeam} won by ${i1.runs - i2.runs} runs`;
          else resultText = 'Match tied';

          if (isLeague) {
            const s1 = ensure(i1.battingTeam), s2 = ensure(i2.battingTeam);
            s1.p++; s2.p++;
            const b1 = i1.wickets >= maxWkts && maxBalls > 0 ? maxBalls : i1.legalBalls;
            const b2 = i2.wickets >= maxWkts && maxBalls > 0 ? maxBalls : i2.legalBalls;
            s1.rf += i1.runs; s1.bf += b1; s1.ra += i2.runs; s1.ba += b2;
            s2.rf += i2.runs; s2.bf += b2; s2.ra += i1.runs; s2.ba += b1;
            if (i1.runs > i2.runs) { s1.w++; s2.l++; s1.pts += (t.points_for_win ?? 2); }
            else if (i2.runs > i1.runs) { s2.w++; s1.l++; s2.pts += (t.points_for_win ?? 2); }
            else { s1.pts += (t.points_for_tie ?? 1); s2.pts += (t.points_for_tie ?? 1); }
          }
        }

        return `
          <a class="glass match-card" href="?match=${encodeURIComponent(m.id)}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <strong>${esc(i1.battingTeam)} ${i1.runs}/${i1.wickets} (${Math.floor(i1.legalBalls/6)}.${i1.legalBalls%6})</strong>
              <span class="format-pill">${esc(m.format_label)}</span>
            </div>
            <div style="margin-top:4px;font-size:14px;">
              ${i2Started ? `${esc(i2.battingTeam)} ${i2.runs}/${i2.wickets} (${Math.floor(i2.legalBalls/6)}.${i2.legalBalls%6})` : `${esc(i2.battingTeam)} · Yet to bat`}
            </div>
            <div class="muted" style="margin-top:6px;font-size:12px;color:${completed ? 'var(--green)' : 'var(--muted)'};">${esc(resultText)}</div>
          </a>
        `;
      }).join('');

      const tableRows = Object.values(stats).map(s => {
        const rrFor = s.bf > 0 ? (s.rf / (s.bf / 6)) : 0;
        const rrAgainst = s.ba > 0 ? (s.ra / (s.ba / 6)) : 0;
        const nrr = (s.bf > 0 && s.ba > 0) ? (rrFor - rrAgainst) : 0;
        return { ...s, nrr };
      }).sort((a, b) => (b.pts - a.pts) || (b.nrr - a.nrr) || (b.w - a.w) || a.name.localeCompare(b.name));

      const startTxt = formatShortDateMs(t.start_date);
      const endTxt = formatShortDateMs(t.end_date);
      const dateTxt = startTxt && endTxt ? (startTxt === endTxt ? startTxt : `${startTxt} – ${endTxt}`) : (startTxt ? `Starts ${startTxt}` : (endTxt ? `Ends ${endTxt}` : null));
      const metaLine = [t.format_label, `${teamNames.length} teams`, t.location, dateTxt].filter(Boolean).join(' · ');

      document.getElementById('app').innerHTML = `
        <div class="glass">
          <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:0.8px;color:var(--green);">TOURNAMENT</div>
          <h1 style="font-size:24px;font-weight:700;margin:6px 0 4px;">${esc(t.name)}</h1>
          <div class="muted">${esc(metaLine)}</div>
        </div>
        ${tableRows.length > 0 ? `
          <div class="glass" style="padding:14px 16px;">
            <div class="section-title" style="margin-bottom:10px;">Standings</div>
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr class="muted" style="text-align:right;border-bottom:1px solid var(--border);">
                  <th style="text-align:left;padding:6px 4px;">Team</th>
                  <th style="padding:6px 4px;">P</th>
                  <th style="padding:6px 4px;">W</th>
                  <th style="padding:6px 4px;">L</th>
                  <th style="padding:6px 4px;">Pts</th>
                  <th style="padding:6px 4px;">NRR</th>
                </tr>
              </thead>
              <tbody>
                ${tableRows.map((r, idx) => `
                  <tr style="text-align:right;border-bottom:1px solid var(--border);">
                    <td style="text-align:left;padding:8px 4px;font-weight:600;">${idx + 1}. ${esc(r.name)}</td>
                    <td style="padding:8px 4px;">${r.p}</td>
                    <td style="padding:8px 4px;">${r.w}</td>
                    <td style="padding:8px 4px;">${r.l}</td>
                    <td style="padding:8px 4px;font-weight:700;">${r.pts}</td>
                    <td style="padding:8px 4px;">${r.nrr >= 0 ? '+' : ''}${r.nrr.toFixed(3)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : ''}
        ${matchList.length > 0 ? `<div class="section-title">Matches (${matchList.length})</div>${matchCardsHtml}` : `<div class="glass muted">No matches synced for this tournament yet.</div>`}
      `;
    }

    if (teamCode) {
      loadTeamInvite(teamCode);
    } else if (tournamentId) {
      if (/Android/i.test(navigator.userAgent)) {
        const openBtn = document.getElementById('open-app-btn');
        if (openBtn) {
          const fallback = encodeURIComponent(window.location.href);
          openBtn.href = `intent://tournament/${encodeURIComponent(tournamentId)}#Intent;scheme=crease;package=app.awventures.crease;S.browser_fallback_url=${fallback};end`;
          openBtn.style.display = 'inline-flex';
        }
      }
      loadTournament(tournamentId);
    } else if (authCode && !matchId) {
      document.getElementById('app').innerHTML = `
        <div class="glass">
          <div class="section-title" style="color:var(--green);">Email verified</div>
          <p class="muted" style="margin-top:8px;">Your Crease account is confirmed. You can close this tab and return to the Crease app.</p>
        </div>
      `;
    } else if (matchId) {
      // On Android browsers, expose a zero-error "Open in App" button using intent://
      // with fallback to the current live web scorecard URL.
      if (/Android/i.test(navigator.userAgent)) {
        const openBtn = document.getElementById('open-app-btn');
        if (openBtn) {
          const fallback = encodeURIComponent(window.location.href);
          openBtn.href = `intent://match/${encodeURIComponent(matchId)}#Intent;scheme=crease;package=app.awventures.crease;S.browser_fallback_url=${fallback};end`;
          openBtn.style.display = 'inline-flex';
        }
      }
      loadSingleMatch(matchId);
    } else {
      loadRecentMatches();
    }
  </script>
</body>
</html>
